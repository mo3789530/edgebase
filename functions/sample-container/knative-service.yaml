apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sample-container
  namespace: edge-functions
  labels:
    edgebase.io/function-name: sample-container
    edgebase.io/managed-by: function-controller
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 5
      containers:
        - image: ghcr.io/edgebase/sample-container:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
  traffic:
    - latestRevision: true
      percent: 100
